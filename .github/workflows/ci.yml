name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: OTP ${{ matrix.otp }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        otp: ["27", "28", "29"]
    steps:
      - uses: actions/checkout@v5

      # rebar3 ships as a self-contained escript with precompiled .beam
      # files; BEAM's loader refuses to load ones compiled too far below
      # the running OTP version. Keep this reasonably current (bump when
      # bumping the OTP matrix above) rather than pinned to an old
      # release, or it'll eventually fail to even start on a new OTP
      # major - which is exactly what happened with 3.24 on OTP 29.
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          rebar3-version: "3.27"

      - name: Restore dialyzer PLT cache
        uses: actions/cache@v5
        with:
          path: _build/default/rebar3_*_plt
          key: dialyzer-plt-${{ runner.os }}-otp${{ matrix.otp }}-${{ hashFiles('rebar.config') }}
          restore-keys: |
            dialyzer-plt-${{ runner.os }}-otp${{ matrix.otp }}-

      - name: Compile
        run: rebar3 compile

      - name: Check formatting (erlfmt)
        run: rebar3 fmt --check

      - name: Run EUnit tests
        run: rebar3 eunit

      - name: Dialyzer
        run: rebar3 dialyzer

  docs:
    name: Publish docs
    needs: test
    # Only from main, not PRs - a fork PR's GITHUB_TOKEN can't get Pages
    # write access anyway, and there's no reason to publish docs for a
    # commit that hasn't landed.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          rebar3-version: "3.27"

      - name: Build docs
        run: rebar3 ex_doc

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: doc

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
